<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rhythm4G Online</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">Rhythm4G <span>Online</span></div>
        <div class="subtitle">Developer: 집돌이 페렐만</div>
      </div>
      <nav class="top-actions">
        <a class="link-btn" href="https://drive.google.com/file/d/16K75hilq63fbOOWtmtmwqpYPxXOkQl-s/view?usp=drive_link" target="_blank" rel="noopener noreferrer">채보 제작 프로그램</a>
        <a class="link-btn" href="https://www.coshaman.com" target="_blank" rel="noopener noreferrer">개발자 포트폴리오</a>
        <button id="openSettingsBtn" class="ghost-btn">설정</button>
      </nav>
    </header>

    <main id="launcher" class="launcher">
      <section class="hero-card">
        <div>
          <h1>Rhythm4G Online</h1>
          <p>온라인 라이브러리에서 곡을 고르거나, 로컬의 채보와 음악 파일을 직접 선택해 플레이합니다.</p>
          <div class="hero-links">
            <a href="https://drive.google.com/file/d/16K75hilq63fbOOWtmtmwqpYPxXOkQl-s/view?usp=drive_link" target="_blank" rel="noopener noreferrer">채보 제작 프로그램 다운로드</a>
            <a href="https://www.coshaman.com" target="_blank" rel="noopener noreferrer">집돌이 페렐만 포트폴리오</a>
          </div>
        </div>
        <div class="status-box">
          <div class="status-label">라이브러리</div>
          <div id="libraryStatus" class="status-value">불러오는 중...</div>
        </div>
      </section>

      <section class="grid-layout">
        <section class="panel library-panel">
          <div class="panel-head">
            <div>
              <h2>온라인 라이브러리</h2>
              <p>등록된 곡과 채보를 선택해 바로 플레이합니다.</p>
            </div>
            <button id="refreshLibraryBtn" class="small-btn">새로고침</button>
          </div>
          <div id="songList" class="song-list"></div>
        </section>

        <aside class="panel side-panel">
          <h2>로컬 파일로 플레이</h2>
          <p>채보 JSON과 음악 파일을 선택합니다. 파일은 서버로 업로드되지 않습니다.</p>
          <label class="file-row">
            <span>채보 JSON</span>
            <input id="localChartInput" type="file" accept=".json,application/json" />
          </label>
          <label class="file-row">
            <span>음악 파일</span>
            <input id="localAudioInput" type="file" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a" />
          </label>
          <button id="playLocalBtn" class="primary-btn full">로컬 파일 플레이</button>
          <div id="localStatus" class="hint"></div>

          <hr />

          <h2>선택한 곡</h2>
          <div id="selectedInfo" class="selected-info">아직 선택된 곡이 없습니다.</div>
          <button id="playSelectedBtn" class="primary-btn full" disabled>선택한 채보 플레이</button>
        </aside>
      </section>
    </main>

    <section id="gameView" class="game-view hidden">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>
      <div class="game-actions">
        <button id="backToLauncherBtn" class="ghost-btn">목록으로</button>
        <button id="fullscreenBtn" class="ghost-btn">전체화면</button>
      </div>
      <div id="touchLanes" class="touch-lanes"></div>
    </section>

    <dialog id="settingsDialog" class="settings-dialog">
      <form method="dialog" class="settings-form">
        <div class="dialog-head">
          <h2>전역 설정</h2>
          <button class="ghost-btn" value="close">닫기</button>
        </div>
        <div class="settings-grid">
          <label>4키 배치 <input id="keys4Input" type="text" placeholder="D F J K" /></label>
          <label>6키 배치 <input id="keys6Input" type="text" placeholder="S D F J K L" /></label>
          <label>일시정지 키 <input id="pauseKeyInput" type="text" placeholder="P" /></label>
          <label>리트라이 키 <input id="retryKeyInput" type="text" placeholder="Backspace" /></label>
          <label>뒤로가기 키 <input id="backKeyInput" type="text" placeholder="Escape" /></label>
          <label>전역 싱크(ms) <input id="offsetInput" type="number" step="1" /></label>
          <label>노트 속도 배율 <input id="speedInput" type="number" step="0.05" min="0.3" max="3" /></label>
          <label>BPM 수동값 <input id="bpmInput" type="number" step="0.01" min="0" placeholder="0 = 채보값 사용" /></label>
          <label>ACC 방식
            <select id="accModeInput">
              <option value="cumulative">누적</option>
              <option value="start100">100% 시작</option>
            </select>
          </label>
          <label class="checkbox-line"><input id="autoSyncInput" type="checkbox" /> 자동 싱크</label>
        </div>
        <div class="dialog-actions">
          <button id="resetSettingsBtn" class="small-btn" type="button">기본값</button>
          <button id="saveSettingsBtn" class="primary-btn" value="default">저장</button>
        </div>
      </form>
    </dialog>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
