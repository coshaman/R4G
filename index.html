<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rhythm4G Online</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand">Rhythm4G <span>Online</span></div>
        <div class="subtitle">집돌이 페렐만</div>
      </div>
      <nav class="top-actions" aria-label="바로가기">
        <a class="link-btn" href="https://drive.google.com/file/d/16K75hilq63fbOOWtmtmwqpYPxXOkQl-s/view?usp=drive_link" target="_blank" rel="noopener noreferrer">채보 제작 프로그램</a>
        <a class="link-btn" href="https://www.coshaman.com" target="_blank" rel="noopener noreferrer">포트폴리오</a>
        <button id="openSettingsBtn" class="ghost-btn">설정</button>
      </nav>
    </header>

    <main id="launcher" class="launcher">
      <section class="quickbar">
        <div class="status-pill">
          <span>라이브러리</span>
          <strong id="libraryStatus">불러오는 중...</strong>
        </div>
        <div class="selected-strip">
          <span>선택</span>
          <div id="selectedInfo" class="selected-info">아직 선택된 곡이 없습니다.</div>
        </div>
        <button id="playSelectedBtn" class="primary-btn play-now" disabled>선택한 채보 플레이</button>
      </section>

      <section class="dashboard">
        <section class="panel library-panel">
          <div class="panel-head compact-head">
            <div>
              <h1>온라인 라이브러리</h1>
              <p>등록된 곡을 선택하면 바로 플레이할 수 있습니다.</p>
            </div>
            <button id="refreshLibraryBtn" class="small-btn">새로고침</button>
          </div>
          <div id="songList" class="song-list"></div>
        </section>

        <aside class="side-stack">
          <section class="panel action-panel">
            <h2>로컬 파일 플레이</h2>
            <label class="file-row">
              <span>채보 JSON</span>
              <input id="localChartInput" type="file" accept=".json,application/json" />
            </label>
            <label class="file-row">
              <span>음악 파일</span>
              <input id="localAudioInput" type="file" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a" />
            </label>
            <button id="playLocalBtn" class="primary-btn full">로컬 파일 플레이</button>
            <div id="localStatus" class="hint"></div>
          </section>

          <section class="panel action-panel">
            <h2>자작 채보 제작</h2>
            <p>음악을 재생하며 입력한 키를 채보로 기록합니다. 3초 이상 누르면 롱노트로 저장됩니다.</p>
            <label class="file-row">
              <span>음악 파일</span>
              <input id="createAudioInput" type="file" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a" />
            </label>
            <label class="file-row inline-field">
              <span>곡 제목</span>
              <input id="createTitleInput" type="text" placeholder="비워두면 파일명 사용" />
            </label>
            <div class="two-cols">
              <label class="file-row">
                <span>난이도</span>
                <select id="createDifficultyInput">
                  <option value="easy">easy</option>
                  <option value="normal" selected>normal</option>
                  <option value="hard">hard</option>
                  <option value="extreme">extreme</option>
                  <option value="master">master</option>
                </select>
              </label>
              <label class="file-row">
                <span>BPM</span>
                <input id="createBpmInput" type="number" step="0.01" min="40" max="260" placeholder="120" />
              </label>
            </div>
            <button id="startCreatorBtn" class="primary-btn full">채보 제작 시작</button>
            <div id="createStatus" class="hint"></div>
          </section>
        </aside>
      </section>
    </main>

    <section id="gameView" class="game-view hidden">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>
      <div class="game-actions">
        <button id="backToLauncherBtn" class="ghost-btn">목록</button>
        <button id="fullscreenBtn" class="ghost-btn">전체화면</button>
      </div>
      <div id="touchLanes" class="touch-lanes"></div>
    </section>

    <dialog id="settingsDialog" class="settings-dialog">
      <form method="dialog" class="settings-form">
        <div class="dialog-head">
          <h2>전역 설정</h2>
          <button class="ghost-btn" value="close">닫기</button>
        </div>
        <div class="settings-grid">
          <label>4키 배치 <input id="keys4Input" type="text" placeholder="D F J K" /></label>
          <label>6키 배치 <input id="keys6Input" type="text" placeholder="S D F J K L" /></label>
          <label>일시정지 키 <input id="pauseKeyInput" type="text" placeholder="P" /></label>
          <label>리트라이 키 <input id="retryKeyInput" type="text" placeholder="Backspace" /></label>
          <label>뒤로가기 키 <input id="backKeyInput" type="text" placeholder="Escape" /></label>
          <label>전역 싱크(ms) <input id="offsetInput" type="number" step="1" /></label>
          <label>노트 속도 배율 <input id="speedInput" type="number" step="0.05" min="0.3" max="3" /></label>
          <label>BPM 수동값 <input id="bpmInput" type="number" step="0.01" min="0" placeholder="0 = 채보값 사용" /></label>
          <label>ACC 방식
            <select id="accModeInput">
              <option value="cumulative">누적</option>
              <option value="start100">100% 시작</option>
            </select>
          </label>
          <label class="checkbox-line"><input id="autoSyncInput" type="checkbox" /> 자동 싱크</label>
        </div>
        <div class="dialog-actions">
          <button id="resetSettingsBtn" class="small-btn" type="button">기본값</button>
          <button id="saveSettingsBtn" class="primary-btn" value="default">저장</button>
        </div>
      </form>
    </dialog>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
